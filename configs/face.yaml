# Facial encoder config (src/models/face_cnn.py)
# EfficientNet-B0 + CBAM, fine-tuned on FER. Fallback: 4-block CNN from scratch.
modality: facial

data:
  root: data/raw/Extracted_images
  # "ferplus" uses Microsoft's FER+ re-annotation of the SAME images (joined on
  # the FER2013 row index in each filename). FER+ disagrees with the original
  # label on ~38% of the training set, so this is a label-quality upgrade with
  # no new images. "folders" keeps the original FER2013 annotation.
  label_source: ferplus
  ferplus_csv: data/raw/ferplus/fer2013new.csv
  image_size: 48
  num_classes: 7
  batch_size: 64
  num_workers: 4
  val_split: 0.15
  test_split: 0.15

model:
  backbone: efficientnet_b0   # timm model name; fallback backbone: "simple_cnn"
  pretrained: true
  use_cbam: true
  embed_dim: 256
  dropout: 0.3
  freeze_backbone_epochs: 2   # warm up the head before unfreezing the backbone

imbalance:
  strategy: class_balanced_focal   # class_balanced_focal | oversample | none
  focal_gamma: 2.0
  class_balanced_beta: 0.999
  # FER is 16.5x imbalanced (Disgust 436 vs Happy 7215); loss weighting alone
  # leaves whole epochs where the minority is barely sampled, so a balanced
  # sampler is layered on top here. Off for speech -- see configs/speech.yaml.
  use_balanced_sampler: true

train:
  epochs: 30
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  early_stopping_patience: 6
  seed: 42

explain:
  gradcam_target_layer: "backbone.conv_head"

checkpoint_dir: artifacts/checkpoints/face
