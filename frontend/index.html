<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paint the browser chrome to match the active theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080e19" />
    <title>CortexAI · Explainable Multimodal Psychiatric Screening</title>
    <meta
      name="description"
      content="CortexAI — explainable multimodal AI decision-support console for psychiatric/mental-health screening."
    />

    <!-- Google Fonts: Inter + JetBrains Mono (same mechanism as the approved Stitch exports) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols (icon font used throughout the approved designs) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied pre-paint to avoid a light flash for dark-theme users.
      (function () {
        try {
          var stored = localStorage.getItem('cortexai.theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
